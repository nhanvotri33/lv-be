<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Micro SD Card Body -->
  <path d="M16 8h24l8 8v36c0 2.2-1.8 4-4 4H16c-2.2 0-4-1.8-4-4V12c0-2.2 1.8-4 4-4z" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Top notch cut -->
  <path d="M12 20h4v6h-4z" fill="#2d2d2d" />
  
  <!-- Left Side Grip Grooves -->
  <path d="M12 28h2v12h-2z" fill="#1a1a1a" />
  
  <!-- Golden Contacts -->
  <g fill="#ffd700">
    <rect x="18" y="12" width="2" height="10" rx="1"/>
    <rect x="23" y="12" width="2" height="10" rx="1"/>
    <rect x="28" y="12" width="2" height="10" rx="1"/>
    <rect x="33" y="12" width="2" height="10" rx="1"/>
    <rect x="38" y="12" width="2" height="10" rx="1"/>
    <rect x="43" y="12" width="2" height="10" rx="1"/>
  </g>
  
  <!-- Micro SD Label Text or Symbol -->
  <text x="32" y="44" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">SD</text>
  
  <!-- Size capacity text (generic, e.g. 128GB) -->
  <text x="32" y="52" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffcc00" text-anchor="middle">128 GB</text>
</svg>
